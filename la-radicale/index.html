<style>
/* Layout: schermata iniziale a riquadri come un'app, ogni sezione è una scheda a colonna singola (max 680px). */
:root{
  --bosco:#1c3a30;      /* verde dei boschi dei Simbruini: testate, testo forte */
  --ink:#22302a;
  --muted:#5d6b64;
  --pietra:#eef0ea;     /* fondo pagina */
  --card:#ffffff;
  --line:#d9ddd3;
  --acqua:#0f6e7c;      /* turchese della piscina: azioni */
  --acqua-soft:#e1f0f1;
  --allarme:#a8321f;    /* solo emergenze */
  --allarme-soft:#fbe9e5;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--pietra);color:var(--ink);font:400 1rem/1.55 var(--body)}
a{color:var(--acqua)}
h1,h2,h3{font-family:var(--display);color:var(--bosco);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acqua);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* barra superiore */
.bar{position:sticky;top:0;z-index:5;background:var(--bosco);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.bar .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.bar .brand{font:700 1.05rem var(--display);color:#fff;text-decoration:none;margin-right:auto}
.back{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;padding:8px 14px 8px 10px;font-weight:600;text-decoration:none}
.lang{display:flex;border:1px solid rgba(255,255,255,.4);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;padding:7px 12px;font-weight:600;font-size:.85rem;letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:#fff;color:var(--bosco)}

/* home */
.hero{position:relative;color:#fff;background:var(--bosco) url(img/panorama.jpg) center/cover}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,58,48,.15),rgba(28,58,48,.82))}
.hero .wrap{position:relative;padding-block:120px 22px}
.hero h1{color:#fff;font-size:clamp(2rem,8vw,2.9rem);font-weight:700}
.hero p{margin-top:6px;font-size:1.05rem;opacity:.95}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;margin-top:16px}
.facts div{background:var(--card);padding:12px 10px;text-align:center}
.facts dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.facts dd{margin:2px 0 0;font:700 1.05rem var(--display);color:var(--bosco);font-variant-numeric:tabular-nums}
.facts small{display:block;font:400 .78rem var(--body);color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-block:22px 8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:104px;padding:12px 6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--bosco);font-weight:600;font-size:.9rem;text-align:center;line-height:1.2}
.tile svg{width:30px;height:30px;color:var(--acqua)}

.tile.sos{grid-column:1/-1;flex-direction:row;min-height:60px;background:var(--allarme-soft);border-color:#eec6bd;color:var(--allarme)}
.tile.sos svg{color:var(--allarme)}
.tile:active{transform:scale(.98)}
svg.i{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;width:20px;height:20px;flex:none}

/* sezioni */
main section{padding-block:22px 40px}
.title{font-size:clamp(1.7rem,6.5vw,2.2rem);font-weight:700;margin-bottom:6px}
.lead{color:var(--muted);margin-bottom:18px;max-width:60ch}
h2{font-size:1.2rem;font-weight:700;margin:26px 0 10px}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{font-size:1.05rem;font-weight:700;margin-bottom:4px}
.card p+p{margin-top:6px}
.meta{color:var(--muted);font-size:.93rem}
.big{font:700 2.4rem/1 var(--display);color:var(--bosco);font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 16px;border-radius:999px;border:1px solid var(--acqua);background:var(--card);color:var(--acqua);font-weight:600;text-decoration:none;font-size:.95rem}
.btn.fill{background:var(--acqua);color:#fff}
.btn.red{background:var(--allarme);border-color:var(--allarme);color:#fff}
.btn.wide{width:100%}
.photo{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r);display:block;margin-bottom:16px}
.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.rooms figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rooms img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.rooms figcaption{padding:10px 12px 12px;font-size:.92rem}
.rooms b{display:block;font-family:var(--display);color:var(--bosco)}
.kv{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 12px}
.kv span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);grid-column:1/-1}
.kv code{font:600 1.25rem ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--bosco);grid-column:1/3;overflow-wrap:anywhere;user-select:all}
ul.plain{margin:0;padding-left:1.1em}
ul.plain li+li{margin-top:6px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chips div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:600;font-size:.93rem}
.chips small{display:block;font-weight:400;color:var(--muted)}
.sosrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sosrow a{flex-direction:column;gap:0;padding:12px 6px;border-radius:var(--r);min-height:76px;font-size:.8rem;line-height:1.2;text-align:center}
.sosrow b{font:700 1.7rem/1.1 var(--display)}
.check{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer}
.check input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--acqua);flex:none}
.check b{display:block;color:var(--bosco)}
.check:has(input:checked){background:var(--acqua-soft);border-color:#b9dadd}
.note{background:var(--acqua-soft);border-radius:var(--r);padding:14px 16px}
footer{border-top:1px solid var(--line);padding-block:20px 32px;color:var(--muted);font-size:.82rem}
footer p+p{margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bosco);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;z-index:9}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}.chips{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

var lang="it";
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function L(o){return o==null?"":(typeof o==="string"?o:(o[lang]||o.it))}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function tel(n){var d=n.replace(/[^\d+]/g,"");if(d.charAt(0)!=="+"&&d.length>3)d="+39"+d;return "tel:"+d}
function btnCall(n,label,cls){return '<a class="btn '+(cls||"")+'" href="'+tel(n)+'">'+ic("phone")+esc(label||n)+'</a>'}
function btnMap(u,label){return '<a class="btn" href="'+u+'" target="_blank" rel="noopener">'+ic("pin")+esc(label||L(T.map))+'</a>'}
function place(p){
  var h='<article class="card"><h3>'+esc(L(p.n))+'</h3>';
  if(p.d)h+='<p>'+esc(L(p.d))+'</p>';
  var meta=[L(p.a),L(p.h),L(p.c)].filter(Boolean);
  if(meta.length)h+='<p class="meta">'+meta.map(esc).join('<br>')+'</p>';
  h+='<div class="actions">'+(p.p?btnCall(p.p):"")+(p.m?btnMap(p.m):"")+'</div></article>';
  return h;
}
function list(a){return '<div class="stack">'+a.map(place).join("")+'</div>'}
function head(id,lead){var s=SECTIONS.filter(function(x){return x[0]===id})[0];return '<h1 class="title">'+esc(L(s[2]))+'</h1>'+(lead?'<p class="lead">'+esc(L(lead))+'</p>':'')}
function hostActions(){return '<div class="actions"><a class="btn fill" href="https://wa.me/'+HOST.wa+'" target="_blank" rel="noopener">'+ic("chat")+'WhatsApp</a>'+btnCall(HOST.tel,L(T.callHost))+'</div>'}

/* ---------- router ---------- */
var app=document.getElementById("app"),back=document.getElementById("back");
function render(){
  var id=decodeURIComponent(location.hash.slice(1));
  if(!V[id]||id==="home")id="home";
  document.documentElement.lang=lang;
  app.innerHTML=id==="home"?V.home():'<main class="wrap"><section>'+V[id]()+'</section></main>';
  back.hidden=id==="home";
  back.innerHTML=ic("left")+L(T.menu);
  document.getElementById("brand").hidden=id!=="home"&&window.innerWidth<420;
  [].forEach.call(document.querySelectorAll(".lang button"),function(b){b.setAttribute("aria-pressed",b.dataset.lang===lang)});
  document.getElementById("foot").innerHTML='<p>Tenuta La Radicale · Contrada Colle Affamato, 00028 Subiaco (RM)</p><p>'+(lang==="it"?"Codici identificativi":"Identification codes")+': Casa Padronale CIN IT058103B4IAYF9E7F · Casette Indipendenti CIN IT058103B4XYXHJV5S</p>';
}
var lastId=null;
window.addEventListener("hashchange",function(){render();window.scrollTo(0,0)});
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-lang]");
  if(b){lang=b.dataset.lang;store("lr-lang",lang);render();return}
  var c=e.target.closest("[data-copy]");
  if(c){
    var v=c.dataset.copy,ok=function(){toast(L(T.copied))};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v).then(ok,function(){fallback(v);ok()})}else{fallback(v);ok()}
  }
});
document.addEventListener("change",function(e){
  if(e.target.dataset&&e.target.dataset.out!==undefined){
    var d={};[].forEach.call(document.querySelectorAll("[data-out]"),function(x){if(x.checked)d[x.dataset.out]=1});
    store("lr-out",JSON.stringify(d));
  }
});
function fallback(v){var t=document.createElement("textarea");t.value=v;document.body.appendChild(t);t.select();try{document.execCommand("copy")}catch(e){}t.remove()}
function toast(m){var t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},1600)}

lang=store("lr-lang")||((navigator.language||"it").toLowerCase().indexOf("it")===0?"it":"en");
render();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(function(){})}
})();
