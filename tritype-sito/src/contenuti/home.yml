hero:
  occhiello: Editoria · Pubblicità · Grafica — Roma
  titolo: Campagne, grafica ed editoria per le aziende.
  sottotitolo: Progettiamo campagne pubblicitarie, curiamo la grafica e realizziamo prodotti editoriali. Un solo interlocutore, dall'idea al file pronto.
  pulsante: Parliamo del tuo progetto
  immagine: ""

servizi:
  titolo: Cosa facciamo
  introduzione: Tre servizi, un unico gruppo di lavoro.
  elenco:
    - titolo: Campagne pubblicitarie B2B
      testo: Pianifichiamo e realizziamo campagne per aziende che si rivolgono ad altre aziende. Messaggio, formati, uscite.
      immagine: ""
    - titolo: Grafica
      testo: Identità visiva, materiali stampati, grafiche per web e social. File pronti per la tipografia e per la pubblicazione.
      immagine: ""
    - titolo: Servizi editoriali
      testo: Testi, impaginazione e cura di pubblicazioni aziendali. Cataloghi, brochure, riviste, volumi.
      immagine: ""

chi_siamo:
  titolo: Chi siamo
  testo: |-
    Tritype è un centro servizi di editoria, pubblicità e grafica con sede a Roma.

    Lavoriamo per le aziende, pubblichiamo il freepress XL Giornale e curiamo i volumi di Libera Editrice Tiburtina.

